<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports House</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; }
        .header { background-color: #007bff; color: white; padding: 15px; text-align: center; }
        .contact-list { list-style: none; padding: 0; }
        .contact-item { background: white; padding: 15px; border-bottom: 1px solid #ddd; display: flex; align-items: center; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; background: #ccc; margin-right: 15px; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-name { font-weight: bold; font-size: 16px; }
        .contact-number { color: #666; font-size: 14px; }
        .call-button { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: auto; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Sports House</h1>
    </div>
    <ul class="contact-list">
        <li class="contact-item">
            <div class="profile-pic"></div>
            <div class="contact-info">
                <span class="contact-name">রহিম</span>
                <span class="contact-number">01918099690</span>
            </div>
            <a href="tel:01918099690" class="call-button">কল করুন</a>
        </li>
    </ul>
</body>
</html>
