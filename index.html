<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports House</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; }
        .header { background-color: #007bff; color: white; padding: 15px; text-align: center; }
        .dialer-container { background: white; padding: 20px; border-bottom: 1px solid #ddd; text-align: center; }
        .dialer-screen { width: 80%; padding: 10px; font-size: 20px; text-align: center; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .dialer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 80%; margin: 0 auto; }
        .dialer-button { padding: 15px; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
        .call-button { background-color: #28a745; color: white; padding: 15px; grid-column: span 3; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; text-decoration: none; display: block; }
    </style>
    <script>
        function addNumber(num) {
            document.getElementById('dialer-screen').value += num;
        }
        function makeCall() {
            var number = document.getElementById('dialer-screen').value;
            if(number) {
                window.location.href = 'tel:' + number;
            }
        }
    </script>
</head>
<body>
    <div class="header">
        <h1>Sports House</h1>
    </div>
    <div class="dialer-container">
        <input type="text" id="dialer-screen" class="dialer-screen" readonly>
        <div class="dialer-grid">
            <button class="dialer-button" onclick="addNumber('1')">1</button>
            <button class="dialer-button" onclick="addNumber('2')">2</button>
            <button class="dialer-button" onclick="addNumber('3')">3</button>
            <button class="dialer-button" onclick="addNumber('4')">4</button>
            <button class="dialer-button" onclick="addNumber('5')">5</button>
            <button class="dialer-button" onclick="addNumber('6')">6</button>
            <button class="dialer-button" onclick="addNumber('7')">7</button>
            <button class="dialer-button" onclick="addNumber('8')">8</button>
            <button class="dialer-button" onclick="addNumber('9')">9</button>
            <button class="dialer-button" onclick="addNumber('*')">*</button>
            <button class="dialer-button" onclick="addNumber('0')">0</button>
            <button class="dialer-button" onclick="addNumber('#')">#</button>
            <a href="#" class="call-button" onclick="makeCall()">কল করুন</a>
        </div>
    </div>
</body>
</html>
